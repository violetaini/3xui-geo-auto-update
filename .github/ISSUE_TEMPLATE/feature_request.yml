name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What operational problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected behavior and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment notes
      description: OS, 3x-ui version, scheduler backend, and relevant constraints.